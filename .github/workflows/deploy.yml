name: Publish blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build website
        uses: withastro/action@v6
        with:
          node-version: "24"
          package-manager: pnpm@10.33.0
        env:
          SITE_URL: https://morpheusdn.github.io

      - name: Publish website
        id: pages
        uses: actions/deploy-pages@v5